name: Apply completion patch 2

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply completion patch from repository blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/git/blobs/20ced3abf8e9d6a5c76f35ed38cd881054aad1bc \
            | jq -r '.content' | tr -d '\n' | base64 -d | gzip -d > /tmp/completion2.patch
          git apply --check /tmp/completion2.patch
          git apply /tmp/completion2.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates data docs
          git commit -m 'feat: add Harper-backed linguistic evidence and close executable rule gaps'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
