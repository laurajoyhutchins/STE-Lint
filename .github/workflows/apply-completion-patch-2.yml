name: Apply completion fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Fix first compiler integration errors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          mod = Path('crates/ste-lint/src/analysis/mod.rs')
          text = mod.read_text()
          text = text.replace('mod linguistic;\n', 'pub(crate) mod linguistic;\n')
          mod.write_text(text)

          grammar = Path('crates/ste-lint/src/analysis/grammar.rs')
          text = grammar.read_text()
          text = text.replace(
              '    let Some(token) = analysis.tokens().get(token_index) else {\n        return Resolution::Unknown;\n    };\n',
              '    if analysis.tokens().get(token_index).is_none() {\n        return Resolution::Unknown;\n    }\n',
              1,
          )
          marker = 'fn is_copula(value: &str) -> bool {'
          helper = '''fn is_determiner(value: &str) -> bool {\n    matches!(\n        value.to_ascii_lowercase().as_str(),\n        "a" | "an" | "the" | "this" | "that" | "these" | "those"\n    )\n}\n\n'''
          if helper not in text:
              text = text.replace(marker, helper + marker)
          grammar.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/ste-lint/src/analysis/mod.rs crates/ste-lint/src/analysis/grammar.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: connect Harper evidence to existing grammar interfaces'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
