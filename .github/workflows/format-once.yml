name: Format Once

on:
  push:
    branches:
      - chatgpt/deterministic-rule-audit-20260818

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/deterministic-rule-audit-20260818
      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --no-self-update
      - name: Normalize and self-remove
        run: |
          cargo +1.97.1 fmt --all
          rm -f .github/workflows/format-once.yml .format-once-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Apply rustfmt normalization"
            git push origin HEAD:chatgpt/deterministic-rule-audit-20260818
          fi
