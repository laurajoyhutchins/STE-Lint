name: Capture test failure

on:
  pull_request:

permissions:
  contents: read

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - name: Run workspace tests and capture output
        id: tests
        shell: bash
        run: |
          set +e
          cargo +1.97.1 test --workspace --locked -- --nocapture > /tmp/test-output.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: ste-lint-test-output
          path: /tmp/test-output.txt
          if-no-files-found: error
      - name: Preserve failing status
        if: steps.tests.outputs.status != '0'
        run: exit 1
