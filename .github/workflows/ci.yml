name: CI

on: [push, pull_request]

jobs:
  reconcile-coverage:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/chatgpt/deterministic-rule-audit-20260818' &&
      github.actor != 'github-actions[bot]' &&
      github.event.head_commit.message == 'Normalize combined deterministic coverage boundary'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/deterministic-rule-audit-20260818
          fetch-depth: 0
      - name: Install pinned Rust formatter
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component rustfmt
          --no-self-update
      - name: Merge coverage authorities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          AUDIT = "87e92da00433a86f249929d784a28a1b693ba60f"
          COUNTING = "56018dbde60d0bff91ea1d1e4936bf2c7943c774"

          def show(commit, path):
              return subprocess.check_output(
                  ["git", "show", f"{commit}:{path}"], text=True
              )

          audit = json.loads(show(AUDIT, "data/rules.json"))
          combined = json.loads(show(COUNTING, "data/rules.json"))
          audit_by_id = {rule["id"]: rule for rule in audit["rules"]}
          audit_owned = {
              "1.2", "1.4", "1.7", "1.13", "1.14", "2.1",
              "3.1", "3.2", "3.3", "3.4", "3.5", "3.7",
              "4.3", "5.3", "6.6", "8.4",
          }
          combined["rules"] = [
              audit_by_id[rule["id"]] if rule["id"] in audit_owned else rule
              for rule in combined["rules"]
          ]
          Path("data/rules.json").write_text(
              json.dumps(combined, separators=(",", ":")) + "\n"
          )

          implemented = ["2.2", "5.1", "6.3", "6.6", "8.1", "8.4", "8.5", "8.6", "8.7"]

          path = Path("crates/ste-cli/src/coverage.rs")
          text = path.read_text()
          old_loop = 'for id in ["2.2", "5.1", "6.3", "8.1", "8.5", "8.6", "8.7"] {'
          new_loop = 'for id in ["2.2", "5.1", "6.3", "6.6", "8.1", "8.4", "8.5", "8.6", "8.7"] {'
          assert old_loop in text
          text = text.replace(old_loop, new_loop)
          text = text.replace('        assert_eq!(status("8.4"), CoverageStatus::Partial);\n', '')
          assert 'Some(7)' in text and 'Some(35)' in text
          text = text.replace('Some(7)', 'Some(9)', 1).replace('Some(35)', 'Some(33)', 1)
          path.write_text(text)

          path = Path("crates/ste-cli/tests/coverage.rs")
          text = path.read_text()
          assert 'implemented: 7' in text and 'partial: 35' in text
          text = text.replace('implemented: 7', 'implemented: 9').replace('partial: 35', 'partial: 33')
          path.write_text(text)

          path = Path("crates/ste-cli/tests/coverage_evidence.rs")
          text = path.read_text()
          old_set = 'BTreeSet::from(["2.2", "5.1", "6.3", "8.1", "8.5", "8.6", "8.7"])'
          new_set = 'BTreeSet::from(["2.2", "5.1", "6.3", "6.6", "8.1", "8.4", "8.5", "8.6", "8.7"])'
          assert old_set in text
          text = text.replace(old_set, new_set)
          path.write_text(text)

          path = Path("crates/ste-cli/tests/source_rule_map.rs")
          text = show(AUDIT, str(path))
          assert 'rules["2.2"]["status"], "partial"' in text
          text = text.replace('rules["2.2"]["status"], "partial"', 'rules["2.2"]["status"], "implemented"')
          anchor = '    assert_eq!(rules["3.3"]["status"], "partial");\n'
          additions = (
              '    assert_eq!(rules["5.1"]["status"], "implemented");\n'
              '    assert_eq!(rules["6.3"]["status"], "implemented");\n'
              '    assert_eq!(rules["8.1"]["status"], "implemented");\n'
              '    assert_eq!(rules["8.6"]["status"], "implemented");\n'
          )
          assert anchor in text
          text = text.replace(anchor, additions + anchor, 1)
          assert 'Some(&4)' in text and 'Some(&38)' in text
          text = text.replace('Some(&4)', 'Some(&9)', 1).replace('Some(&38)', 'Some(&33)', 1)
          path.write_text(text)

          path = Path("docs/rule-coverage.md")
          text = show(COUNTING, str(path))
          old_84 = (
              'Rule 8.4 remains `partial` because complex or nested vertical-list boundary semantics '
              'are an independent structural requirement. Completing Rule 8.6 does not erase that boundary.'
          )
          new_84 = (
              'Rule 8.4 is implemented for the supported source model through the parser-backed semantic '
              'list tree: the introducing colon terminates its count unit, and wrapped or nested items become '
              'independent count units. This does not decide the separate Rule 4.3 editorial question of when '
              'prose is complex enough to require a vertical list.'
          )
          assert old_84 in text
          text = text.replace(old_84, new_84)
          marker = '## Rule 8.1 authored-text boundary\n'
          grammar = (
              '## Deterministic grammar evidence\n\n'
              'Generic syntax and morphology are evidence layers, not STE authority. CommonMark supplies '
              'document structure, and the pinned Harper/Brill stack supplies deterministic generic token, '
              'part-of-speech, chunk, and morphology evidence. Approval, grammatical identity, allowed forms, '
              'and terminology identity still come from the verified ASD-STE100 runtime or governed project '
              'terminology. If competing authoritative interpretations would produce different rule verdicts, '
              'the linter blocks or leaves the application unresolved instead of selecting a heuristic answer.\n\n'
              'The deterministic-rule audit deliberately leaves source requirements partial when meaning or '
              'editorial judgment remains necessary. Rule 3.7 still requires identifying an action-denoting '
              'non-verb and the applicable approved verb. Rule 4.3 still requires deciding that prose is '
              'sufficiently complex to require a vertical list. Rule 1.14 still requires a versioned offline '
              'American-English spelling authority plus governed external-directive exceptions for a complete claim.\n\n'
          )
          assert marker in text
          text = text.replace(marker, grammar + marker, 1)
          text = text.replace('- 7 `implemented`;\n- 35 `partial`;', '- 9 `implemented`;\n- 33 `partial`;')
          old_inventory = (
              'The implemented rules are 2.2, 5.1, 6.3, 8.1, 8.5, 8.6, and 8.7. '
              'Rules 5.1 and 6.3 became complete when their sole remaining dependency, the shared Issue 9 '
              'count-group model, became complete.'
          )
          new_inventory = (
              'The implemented rules are 2.2, 5.1, 6.3, 6.6, 8.1, 8.4, 8.5, 8.6, and 8.7. '
              'Rules 5.1 and 6.3 use the completed shared Issue 9 count-group model. Rule 6.6 uses parser-backed '
              'paragraph identity, and Rule 8.4 uses the shared semantic list tree and canonical count projection.'
          )
          assert old_inventory in text
          text = text.replace(old_inventory, new_inventory)
          path.write_text(text)

          path = Path("README.md")
          text = show(COUNTING, str(path))
          old_verb = '- direct `HAVE`/`HAS`/`HAD` plus approved-past-participle detection for the deterministic portion of Rule 3.4;'
          new_verb = '- a shared deterministic verb-construction projection for source-backed perfect, progressive, passive/adjectival, and allowed simple-future evidence, with ambiguity failing closed;'
          assert old_verb in text
          text = text.replace(old_verb, new_verb)
          old_list = '- bounded vertical-list mechanics with parser-backed Markdown structure plus STE-specific list forms and punctuation/counting semantics;'
          new_list = (
              '- parser-backed semantic vertical-list structure with CommonMark and STE-specific list forms, '
              'wrapped/nested item identity, punctuation mechanics, and Rule 8.4 count-unit boundaries;\n'
              '- parser-backed Rule 6.6 enforcement of the six-sentence descriptive-paragraph limit;'
          )
          assert old_list in text
          text = text.replace(old_list, new_list)
          path.write_text(text)

          statuses = {}
          for rule in combined["rules"]:
              statuses.setdefault(rule["status"], []).append(rule["id"])
          assert statuses.get("implemented") == implemented, statuses.get("implemented")
          assert len(statuses.get("partial", [])) == 33
          assert len(statuses.get("context_required", [])) == 11
          assert len(statuses.get("not_implemented", [])) == 0
          assert combined["full_compliance_claimed"] is False
          PY
          cargo +1.97.1 fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rules.json docs/rule-coverage.md README.md crates/ste-cli/src/coverage.rs crates/ste-cli/tests/coverage.rs crates/ste-cli/tests/coverage_evidence.rs crates/ste-cli/tests/source_rule_map.rs
          git commit -m "Finalize combined deterministic coverage boundary"
          git push origin HEAD:chatgpt/deterministic-rule-audit-20260818

  authority-ingest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile authority ingest tooling
        run: >-
          python -m py_compile
          tools/authority-ingest/ingest_issue9.py
          tools/authority-ingest/test_ingest_issue9.py
          tools/authority-ingest/build_runtime_lexicon.py
          tools/authority-ingest/test_build_runtime_lexicon.py
      - name: Test authority ingest tooling
        run: python -m unittest discover -s tools/authority-ingest -p 'test_*.py' -v

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component rustfmt
          --component clippy
          --no-self-update
      - name: Build
        run: cargo +1.97.1 build --workspace --locked
      - name: Test
        run: cargo +1.97.1 test --workspace --locked
      - name: Format
        run: cargo +1.97.1 fmt --all -- --check
      - name: Clippy
        run: cargo +1.97.1 clippy --workspace --all-targets --locked -- -D warnings
      - name: Coverage report
        run: ./target/debug/ste coverage
      - name: Coverage report JSON
        run: ./target/debug/ste coverage --format json
