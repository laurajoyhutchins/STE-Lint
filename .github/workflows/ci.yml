name: CI

on: [push, pull_request]

permissions:
  contents: write

jobs:
  authority-ingest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile authority ingest tooling
        run: >-
          python -m py_compile
          tools/authority-ingest/ingest_issue9.py
          tools/authority-ingest/test_ingest_issue9.py
          tools/authority-ingest/build_runtime_lexicon.py
          tools/authority-ingest/test_build_runtime_lexicon.py
      - name: Test authority ingest tooling
        run: python -m unittest discover -s tools/authority-ingest -p 'test_*.py' -v

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component rustfmt
          --component clippy
          --no-self-update
      - name: Refresh implementation lockfile once
        if: github.event_name == 'push' && github.ref == 'refs/heads/chatgpt/deterministic-rule-audit-20260818'
        run: |
          cargo +1.97.1 metadata --format-version 1 > /dev/null
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add Cargo.lock
            git commit -m 'deps: refresh deterministic grammar lockfile'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Build
        run: cargo +1.97.1 build --workspace --locked
      - name: Format
        run: cargo +1.97.1 fmt --all -- --check
      - name: Clippy
        run: cargo +1.97.1 clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo +1.97.1 test --workspace --locked
      - name: Coverage text
        run: ./target/debug/ste coverage
      - name: Coverage JSON
        run: ./target/debug/ste coverage --format json
