name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ste-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authority-ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Bind exact CI candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            read -r tested base head extra <<< "$(git rev-list --parents -n 1 HEAD)"
            test -z "${extra:-}"
            test "$tested" = "$EXPECTED_SHA"
            test "$head" = "$PR_HEAD_SHA"
          fi
          {
            echo '### Verification identity'
            printf 'tested SHA: %s\n' "$(git rev-parse HEAD)"
            printf 'tested tree: %s\n' "$(git rev-parse 'HEAD^{tree}')"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compile authority ingest tooling
        run: >-
          python -m py_compile
          tools/authority-ingest/ingest_issue9.py
          tools/authority-ingest/test_ingest_issue9.py
          tools/authority-ingest/build_runtime_lexicon.py
          tools/authority-ingest/test_build_runtime_lexicon.py
          scripts/release_smoke.py
          scripts/package_linux_release.py
          scripts/verify_linux_release.py
          scripts/test_release_gate.py
      - name: Test authority ingest tooling
        run: python -m unittest discover -s tools/authority-ingest -p 'test_*.py' -v
      - name: Test public release admission and hostile smoke cases
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Bind exact CI candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            read -r tested base head extra <<< "$(git rev-list --parents -n 1 HEAD)"
            test -z "${extra:-}"
            test "$tested" = "$EXPECTED_SHA"
            test "$head" = "$PR_HEAD_SHA"
          fi
          {
            echo '### Verification identity'
            printf 'tested SHA: %s\n' "$(git rev-parse HEAD)"
            printf 'tested tree: %s\n' "$(git rev-parse 'HEAD^{tree}')"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component rustfmt
          --component clippy
          --no-self-update
      - name: Build
        run: cargo +1.97.1 build --workspace --locked
      - name: Test
        run: cargo +1.97.1 test --workspace --locked
      - name: Format
        run: cargo +1.97.1 fmt --all -- --check
      - name: Clippy
        run: cargo +1.97.1 clippy --workspace --all-targets --locked -- -D warnings
      - name: Coverage report
        run: ./target/debug/ste coverage
      - name: Coverage report JSON
        run: ./target/debug/ste coverage --format json
      - name: Public release smoke without private runtime
        run: python3 scripts/release_smoke.py target/debug/ste
