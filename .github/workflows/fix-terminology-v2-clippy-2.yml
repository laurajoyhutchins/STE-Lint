name: Apply terminology v2 clippy cleanup

on:
  push:
    branches:
      - issue-52-terminology-v2

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-52-terminology-v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply cleanup
        run: python scripts/fix-terminology-v2-clippy.py
      - name: Format
        run: cargo fmt --all
      - name: Remove one-shot machinery
        run: rm scripts/fix-terminology-v2-clippy.py .github/workflows/fix-terminology-v2-clippy-2.yml
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Clean up terminology v2 compatibility code"
          git push origin HEAD:issue-52-terminology-v2
