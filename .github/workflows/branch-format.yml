name: Branch Format

on:
  push:
    branches:
      - feat/rules-2-2-8-1-8-6-deterministic

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rules-2-2-8-1-8-6-deterministic
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --no-self-update
      - name: Format
        run: cargo +1.97.1 fmt --all
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/ste-lint
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply pinned Rust formatting"
          git push origin HEAD:feat/rules-2-2-8-1-8-6-deterministic
