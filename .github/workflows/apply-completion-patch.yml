name: Apply completion patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply staged completion patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/completion.patch
          if ! git apply --check /tmp/completion.patch; then
            echo 'Patch already applied or no longer applicable.'
            exit 0
          fi
          git apply /tmp/completion.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/ste-lint/src/structure.rs
          git commit -m 'refactor: derive code spans from CommonMark parser'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
