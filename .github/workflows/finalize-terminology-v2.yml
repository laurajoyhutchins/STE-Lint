name: Finalize terminology v2 docs and compatibility

on:
  push:
    branches:
      - issue-52-terminology-v2

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-52-terminology-v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply finalization
        run: python scripts/finalize-terminology-v2-docs.py
      - name: Format
        run: cargo fmt --all
      - name: Remove one-shot machinery
        run: rm scripts/finalize-terminology-v2-docs.py .github/workflows/finalize-terminology-v2.yml
      - name: Commit finalization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finalize terminology v2 documentation and compatibility"
          git push origin HEAD:issue-52-terminology-v2
