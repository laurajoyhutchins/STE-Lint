name: Apply final parser refactor

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply exact final parser patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/git/blobs/ff9394574e935534ff1ab593c1be69052a2191a4 \
            | jq -r '.content' | tr -d '\n' | base64 -d | gzip -d > /tmp/refactor-finish.patch
          git apply --check /tmp/refactor-finish.patch
          git apply /tmp/refactor-finish.patch
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --no-self-update
          cargo +1.97.1 fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/ste-lint
          git commit -m 'refactor: complete parser evidence cutover'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
