name: Apply final parser refactor

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply exact final parser patch
        shell: bash
        run: |
          cat .tmp/refactor-finish.01 .tmp/refactor-finish.02 .tmp/refactor-finish.03 \
            | base64 -d | gzip -d > /tmp/refactor-finish.patch
          git apply --check /tmp/refactor-finish.patch
          git apply /tmp/refactor-finish.patch
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --no-self-update
          cargo +1.97.1 fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/ste-lint
          git commit -m 'refactor: complete parser evidence cutover'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
