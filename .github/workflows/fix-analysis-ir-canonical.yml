name: Apply final terminology v2 test cleanup

on:
  push:
    branches:
      - issue-52-terminology-v2

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-52-terminology-v2
      - name: Update stale analysis assertion
        run: sed -i 's/busway\.term\.term/busway.term.canonical/' crates/ste-lint/tests/analysis_ir.rs
      - name: Format
        run: cargo fmt --all
      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-analysis-ir-canonical.yml
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use compiled canonical term in analysis test"
          git push origin HEAD:issue-52-terminology-v2
