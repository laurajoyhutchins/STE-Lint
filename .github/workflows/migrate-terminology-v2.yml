name: Migrate terminology v2 data

on:
  push:
    branches:
      - issue-52-terminology-v2

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-52-terminology-v2
      - name: Migrate checked-in terminology data
        run: python scripts/migrate-terminology-v2.py
      - name: Remove one-shot migration machinery
        run: rm scripts/migrate-terminology-v2.py .github/workflows/migrate-terminology-v2.yml
      - name: Commit migrated terminology
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profiles fixtures/glossary scripts .github/workflows
          git commit -m "Migrate checked-in terminology data to v2"
          git push origin HEAD:issue-52-terminology-v2
