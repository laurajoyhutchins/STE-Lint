[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
regex = "1"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
pulldown-cmark = { version = "=0.13.4", default-features = false }
harper-core = { version = "=2.7.0", default-features = false }
harper-brill = { version = "=2.8.0", default-features = false }
